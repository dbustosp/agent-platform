repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: no-absolute-paths-in-committed-config
        name: committed Claude Code config must be path-independent
        entry: bash -c 'grep -rn "/Users/\|/home/" .mcp.json .claude/settings.json 2>/dev/null && exit 1 || exit 0'
        language: system
        pass_filenames: false
        files: '^(\.mcp\.json|\.claude/settings\.json)$'
