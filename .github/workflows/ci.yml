name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs opt in to more if they ever need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gateway,harness,dev]'

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Format check
        run: python -m ruff format --check src tests scripts

      - name: Test
        # No credentials and no network are configured for this job on purpose:
        # the suite must pass without either. If a test starts needing an API
        # key, it stops being a test and becomes a monitor.
        run: python -m pytest -q

  control-plane-isolation:
    name: control plane carries no framework (P1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install without the harness extra
        # P5: the gateway must be deployable on a machine where deepagents is
        # not installed. Installing the harness extra here would hide a
        # regression that only bites in production.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gateway,dev]'

      - name: Control plane imports with no agent framework present
        run: |
          python - <<'PY'
          import sys
          import agent_platform, agent_platform.config, agent_platform.policy
          import agent_platform.evidence, agent_platform.gateway
          import agent_platform.claude_code
          banned = {"deepagents", "langchain", "langgraph", "langchain_core"}
          leaked = sorted(m for m in sys.modules if m.split(".")[0] in banned)
          if leaked:
              sys.exit(f"P1 violation: control plane imported {leaked}")
          print("ok: no framework modules imported")
          PY

      - name: Gateway and evidence tests pass without the harness
        run: |
          python -m pytest -q \
            tests/test_gateway_knowledge.py tests/test_gateway_tools.py \
            tests/test_gateway_policy.py tests/test_gateway_server.py \
            tests/test_evidence_record.py tests/test_hashing.py \
            tests/test_sinks.py tests/test_spilling_sink.py \
            tests/test_spill_batch_loss.py tests/test_claude_code_hook.py

  banned-patterns:
    name: portability contract (§3.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: No banned constructions
        # AST, not grep: this repository documents the banned patterns by name,
        # and a text search cannot tell a call site from the paragraph
        # explaining why that call site is forbidden.
        run: python scripts/check_portability_contract.py --github

      - name: Committed config is path-independent
        # An absolute path from one machine breaks every other clone.
        run: |
          set -e
          if grep -rn "/Users/\|/home/" .mcp.json .claude/settings.json 2>/dev/null; then
            echo "::error::committed Claude Code config embeds an absolute home directory"; exit 1
          fi
          echo "ok: config is portable"

  middleware-budget:
    name: interface debt (W2, ceiling 1500 LOC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure custom middleware
        # Watch item W2: custom AgentMiddleware is non-portable by construction.
        # Past the ceiling, logic belongs in an MCP server instead.
        run: |
          set -e
          files=$(grep -rl "AgentMiddleware)" src/ || true)
          if [ -z "$files" ]; then echo "no custom middleware"; exit 0; fi
          total=$(cat $files | wc -l | tr -d ' ')
          echo "custom middleware: $total lines across:"; echo "$files"
          if [ "$total" -gt 1500 ]; then
            echo "::error::W2 breached: $total > 1500 LOC. Move logic into an MCP server."
            exit 1
          fi
          echo "::notice::middleware budget $total / 1500 LOC"
